<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RideLK</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #1a2238;
      --navy-dark: #111827;
      --yellow: #FFD600;
      --yellow-hover: #e6c200;
      --white: #ffffff;
      --text-dark: #1a2238;
      --text-muted: #8a94a6;
      --border: #e2e8f0;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
      --success-bg: #f0fdf4;
      --success-text: #16a34a;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--navy) 58%, var(--yellow) 58%);
      padding: 24px;
    }

    /* ── Unified card wrapper ── */
    .login-card {
      display: flex;
      width: 860px;
      max-width: 100%;
      min-height: 500px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      animation: popIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
    }

    @keyframes popIn {
      from {
        transform: translateY(20px) scale(0.98);
        opacity: 0;
      }

      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    /* ── LEFT: dark brand panel ── */
    .panel-left {
      flex: 1;
      background: var(--navy);
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      background: var(--yellow);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--navy);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--white);
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: #6b7b9a;
    }

    .welcome-block {
      margin-top: auto;
      margin-bottom: 36px;
    }

    .welcome-block h1 {
      font-size: 42px;
      font-weight: 800;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .welcome-block p {
      font-size: 13.5px;
      color: #6b7b9a;
      line-height: 1.6;
    }

    /* Yellow deco circle — bottom-right of left panel, bleeds into right */
    .deco-circle {
      position: absolute;
      bottom: -55px;
      right: -55px;
      width: 160px;
      height: 160px;
      background: var(--yellow);
      border-radius: 50%;
      z-index: 2;
    }

    /* Top-left subtle circle */
    .deco-circle-sm {
      position: absolute;
      top: -30px;
      left: -30px;
      width: 90px;
      height: 90px;
      background: rgba(255, 214, 0, 0.06);
      border-radius: 50%;
    }

    /* ── RIGHT: white form panel ── */
    .panel-right {
      width: 380px;
      flex-shrink: 0;
      background: var(--white);
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 3;
    }

    .card-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--yellow);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 30px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 28px;
      line-height: 1.1;
    }

    /* Alerts */
    .alert {
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .alert-error {
      background: var(--error-bg);
      color: var(--error-text);
    }

    .alert-success {
      background: var(--success-bg);
      color: var(--success-text);
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-dark);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(26, 34, 56, 0.08);
    }

    .form-group input::placeholder {
      color: #c0c7d4;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--yellow);
      color: var(--navy);
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-login:hover {
      background: var(--yellow-hover);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .card-footer {
      text-align: center;
      margin-top: 18px;
    }

    .card-footer a {
      font-size: 13px;
      color: var(--yellow);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .card-footer a:hover {
      color: var(--yellow-hover);
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-card">

    
    <div class="panel-left">
      <div class="deco-circle-sm"></div>

      <div class="brand">
        <div class="brand-badge">RL</div>
        <div class="brand-text">
          <span class="brand-name">RideLK</span>
          <span class="brand-sub">Sri Lankan smart rides</span>
        </div>
      </div>

      <div class="welcome-block">
        <h1>Welcome<br>back.</h1>
      </div>

      <div class="deco-circle"></div>
    </div>

    
    <div class="panel-right">
      <p class="card-label">Account Access</p>
      <h2 class="card-title">Sign in</h2>

      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
      <div th:if="${param.registered}" class="alert alert-success">Registration successful! Please sign in.</div>

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="pass">Password</label>
          <input type="password" id="pass" name="pass" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Login</button>
      </form>

      <div class="card-footer">
        <a href="/register">Create an account</a>
      </div>
    </div>

  </div>

</body>

</html>
